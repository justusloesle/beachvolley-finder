[project]
name = "beach-tournament-finder"
version = "0.1.0"
description = "AI-augmented finder that ranks nearby beach volleyball tournaments by public-transit convenience"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",       # data validation (v2 — ignore v1 tutorials)
    "requests>=2.31",      # HTTP; swap for httpx later if you want async
    "python-dotenv>=1.0",  # loads .env into the environment
    # Add as you reach each phase:
    # "beautifulsoup4>=4.12",  # HTML parsing, if the site has no clean JSON
    # "anthropic>=0.40",       # LLM calls
    # "langchain>=0.3",        # only where it earns its place
    # "streamlit>=1.40",       # the GUI, later
    "geopy>=2.5.0",
    "google-genai>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beach_finder"]
